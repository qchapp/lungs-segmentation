name: Docker Image CI

on:
  push:
    branches: [ master ]
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: vars
        run: |
          VERSION=$(grep -Po '^(version\s*=\s*).*' setup.cfg | sed -E 's/version\s*=\s*//')
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
            context: .
            push: true
            tags: |
              ${{ secrets.DOCKERHUB_USERNAME }}/unet-lungs-segmentation:latest
              ${{ secrets.DOCKERHUB_USERNAME }}/unet-lungs-segmentation:${{ steps.vars.outputs.version }}
              ${{ secrets.DOCKERHUB_USERNAME }}/unet-lungs-segmentation:${{ github.sha }}
