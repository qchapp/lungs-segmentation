name: Build and publish Docker image

on:
  push:
    branches: [ master ]
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (cpu)
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unet-lungs-segmentation:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/unet-lungs-segmentation:${{ github.sha }}

      - name: Build and push (gpu) - optional
        if: contains(github.event.head_commit.message, 'gpu') || github.event_name == 'release'
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile.gpu
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/unet-lungs-segmentation:gpu-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/unet-lungs-segmentation:gpu-${{ github.sha }}
